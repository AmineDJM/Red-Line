# Blueprint Render — Red Line
# Un seul service web (API + WebSocket + client + back-office servis sur la même origine)
# et une base PostgreSQL, en deux environnements :
#   - production : branche `main`, offre Starter (pas de mise en veille)
#   - staging    : branche `staging`, offres gratuites (mise en veille après 15 min, base temporaire)
# L'imagerie satellite (data/tiles/*.pmtiles) est dans le dépôt : aucun disque n'est nécessaire.

services:
  - type: web
    name: redline-server
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npx --yes pnpm@10.33.0 install --frozen-lockfile && npx --yes pnpm@10.33.0 build
    preDeployCommand: node apps/server/dist/migrate.js
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: redline-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Boutique (facultatif : sans ces deux clés, la boutique affiche « paiements indisponibles »).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # URL publique (retours de Stripe Checkout, sujet VAPID), ex. https://redline.onrender.com
      - key: PUBLIC_URL
        sync: false

  - type: web
    name: redline-server-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: staging
    autoDeploy: true
    buildCommand: npx --yes pnpm@10.33.0 install --frozen-lockfile && npx --yes pnpm@10.33.0 build
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: MIGRATE_ON_START
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: redline-db-staging
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Staging : clés Stripe de TEST (sk_test_…) uniquement.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false

databases:
  - name: redline-db
    plan: basic-256mb
    region: frankfurt
    databaseName: redline
    user: redline
  - name: redline-db-staging
    plan: free
    region: frankfurt
    databaseName: redline_staging
    user: redline
