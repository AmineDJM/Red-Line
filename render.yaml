# Blueprint Render — Red Line
# Un seul service web (API + WebSocket + client + back-office servis sur la même origine)
# et une base PostgreSQL, en deux environnements :
#   - production : branche `main`, offre Starter (pas de mise en veille), disque pour les tuiles
#   - staging    : branche `staging`, offres gratuites (mise en veille après 15 min, base temporaire)
# Les tuiles zoom 0-8 se construisent une fois sur le disque (voir docs/deploiement.md).

services:
  - type: web
    name: redline-server
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npx --yes pnpm@10.33.0 install --frozen-lockfile && npx --yes pnpm@10.33.0 build
    preDeployCommand: npx --yes pnpm@10.33.0 --filter @redline/server db:migrate
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /healthz
    disk:
      name: redline-tiles
      mountPath: /var/data/tiles
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: redline-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TILES_DIR
        value: /var/data/tiles
      - key: INSTANCE_ID
        value: prod

  - type: web
    name: redline-server-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: staging
    autoDeploy: true
    buildCommand: npx --yes pnpm@10.33.0 install --frozen-lockfile && npx --yes pnpm@10.33.0 build
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: MIGRATE_ON_START
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: redline-db-staging
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: INSTANCE_ID
        value: staging

databases:
  - name: redline-db
    plan: basic-256mb
    region: frankfurt
    databaseName: redline
    user: redline
  - name: redline-db-staging
    plan: free
    region: frankfurt
    databaseName: redline_staging
    user: redline
