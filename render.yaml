# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Blueprint Render — Red Line (validé contre https://render.com/schema/render.yaml.json)
# Un seul service web (API + WebSocket + client + back-office servis sur la même origine)
# et une base PostgreSQL. Production : branche `main`, offre Starter (pas de mise en veille), déployée
# seulement si la CI passe. Un environnement de test (staging) pourra être ajouté plus tard.
# L'imagerie satellite (data/tiles/*.pmtiles) est dans le dépôt : aucun disque n'est nécessaire.
# Seuils de passage à l'offre supérieure : docs/charge.md.

services:
  - type: web
    name: redline-server
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    # Déploiement automatique uniquement quand les vérifications GitHub (CI) sont au vert.
    autoDeployTrigger: checksPass
    buildCommand: npx --yes pnpm@10.33.0 install --frozen-lockfile && npx --yes pnpm@10.33.0 build
    preDeployCommand: node apps/server/dist/migrate.js
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /healthz
    # Arrêt propre (instantané de chaque partie, libération des baux) avant l'arrêt forcé.
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Starter = 512 Mo : on borne le tas JavaScript pour que le ramasse-miettes travaille avant la limite.
      # À relever avec l'offre (Standard 2 Go : --max-old-space-size=1536).
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Render est derrière Cloudflare : l'IP réelle du joueur est dans CF-Connecting-IP
      # (X-Forwarded-For est falsifiable) — limites de débit et empreintes anti-multicomptes.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: DATABASE_URL
        fromDatabase:
          name: redline-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # URL publique (retours de Stripe Checkout, contact VAPID, URL canoniques, sitemap, partage),
      # ex. https://redline.onrender.com puis le domaine définitif.
      - key: PUBLIC_URL
        sync: false
      # Contact légal par défaut (facultatif ; sinon contact@<domaine de PUBLIC_URL>), modifiable au back-office.
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      # Boutique (facultatif : sans ces deux clés, la boutique affiche « paiements indisponibles »).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: redline-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: '16'
    # Instantanés (~0,4 Mo par partie monde, 3 conservés), journal d'ordres, frames du timelapse.
    diskSizeGB: 5
    databaseName: redline
    user: redline
    # Aucune connexion depuis Internet : seul le service web (réseau privé Render) y accède.
    # Pour une connexion ponctuelle depuis un poste (pg_dump…), ajouter son IP dans le tableau de bord.
    ipAllowList: []
