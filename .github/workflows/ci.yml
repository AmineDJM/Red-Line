name: CI

on:
  push:
    branches: [main, staging, 'claude/**']
  pull_request:

# Un nouveau push annule la vérification en cours de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redline
          POSTGRES_PASSWORD: redline
          POSTGRES_DB: redline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U redline -d redline_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://redline:redline@localhost:5432/redline_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      # Tests unitaires de tous les paquets ; ceux du serveur utilisent la base ci-dessus, dont les
      # parcours complets avec le VRAI moteur et les VRAIES données (partie monde, reprise, bail).
      - run: pnpm test
      - run: pnpm build
      # Même commande que Render : les fichiers précompressés et les dist doivent exister.
      - name: Artefacts de production
        run: |
          test -f apps/server/dist/main.js && test -f apps/server/dist/migrate.js
          test -f apps/client/dist/index.html && test -f apps/admin/dist/index.html
          ls apps/client/dist/assets/*.js.br > /dev/null
          du -sh apps/client/dist apps/admin/dist apps/server/dist
      # Migrations sur une base vide, puis démarrage en production et contrôle de santé.
      - name: Démarrage en production
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://redline:redline@localhost:5432/redline_test
          SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          PORT: '3000'
        run: |
          node apps/server/dist/migrate.js
          node apps/server/dist/main.js &
          for i in $(seq 1 60); do curl -fs localhost:3000/healthz && break; sleep 1; done
          curl -fs localhost:3000/healthz
          curl -fsI localhost:3000/ | grep -i content-security-policy
          curl -fs -o /dev/null localhost:3000/admin/
          kill %1

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redline
          POSTGRES_PASSWORD: redline
          POSTGRES_DB: redline_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U redline -d redline_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://redline:redline@localhost:5432/redline_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7
